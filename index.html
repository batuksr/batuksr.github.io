<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Batuhan Keser</title>
    <meta name="description" content="Batuhan Keser: full stack geliştirici, Selçuk Üniversitesi Bilgisayar Mühendisliği öğrencisi." />
    <link rel="icon" href="/favicon.svg?v=2" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2" />
    <meta name="theme-color" content="#14161a" />
    <!-- Kafa modeli ve çözücüsü, site kodunu beklemeden hemen inmeye başlasın -->
    <link rel="preload" href="/models/head.glb" as="fetch" crossorigin="anonymous" />
    <link rel="preload" href="/draco/draco_wasm_wrapper.js" as="fetch" crossorigin="anonymous" />
    <link rel="preload" href="/draco/draco_decoder.wasm" as="fetch" crossorigin="anonymous" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=Figtree:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- Yükleme ekranı: site kodunu beklemeden ilk anda görünsün diye stili ve
         betiği burada. Ortadaki noktalı küre fareyle döndürülür, tıklanınca
         dağılıp toplanır; noktalar yükleme ilerledikçe renklenir. İki yandaki
         kelimeler de yükleme ilerledikçe ortaya yaklaşır. -->
    <style>
      .loader {
        position: fixed; inset: 0; z-index: 100;
        display: grid; place-items: center;
        background: radial-gradient(ellipse 70% 60% at 50% 42%, #2a2e35 0%, #14161a 100%);
        color: #ede9e2;
        overflow: hidden;
        touch-action: none;
      }
      .loader-word {
        position: absolute; top: 50%;
        font-family: 'Big Shoulders Display', 'Arial Narrow', sans-serif;
        font-weight: 800;
        font-size: clamp(1.1rem, 2.2vw, 1.6rem);
        letter-spacing: 0.08em;
        text-transform: uppercase;
        white-space: nowrap;
      }
      /* --p: 0..1 yükleme. 0'da kelimeler ekran kenarında, 1'de karenin hemen yanında. */
      .loader-word--l {
        left: calc(3vw + (50vw - 76px - 3vw) * var(--p, 0));
        transform: translate(calc(-100% * var(--p, 0)), -50%);
      }
      .loader-word--r {
        right: calc(3vw + (50vw - 76px - 3vw) * var(--p, 0));
        transform: translate(calc(100% * var(--p, 0)), -50%);
      }
      .loader-tile {
        position: relative;
        width: 120px; height: 120px;
        border-radius: 14px;
        background: #22252b;
        box-shadow: 0 20px 50px -20px rgba(0, 0, 0, 0.8), inset 0 0 0 1px rgba(237, 233, 226, 0.06);
        cursor: grab;
      }
      .loader-tile:active { cursor: grabbing; }
      .loader-tile canvas { width: 100%; height: 100%; display: block; }
      .loader-pct {
        position: absolute; left: 50%; top: calc(50% + 84px);
        transform: translateX(-50%);
        font-family: 'Figtree', system-ui, sans-serif;
        font-size: 0.875rem;
        font-variant-numeric: tabular-nums;
        color: #9a9ea6;
      }
      .loader.is-out { opacity: 0; visibility: hidden; transition: opacity 0.7s ease, visibility 0.7s; }
      .loader.is-out .loader-tile { transform: scale(1.25); transition: transform 0.7s cubic-bezier(.2,.7,.2,1); }
      /* Telefonda kelimeler karenin üstünde ve altında, kenardan ortaya kayar */
      @media (max-width: 760px) {
        .loader-word--l {
          top: calc(50% - 104px);
          left: calc(16px + (50vw - 16px) * var(--p, 0));
          transform: translate(calc(-50% * var(--p, 0)), -50%);
        }
        .loader-word--r {
          top: calc(50% + 124px);
          right: calc(16px + (50vw - 16px) * var(--p, 0));
          transform: translate(calc(50% * var(--p, 0)), -50%);
        }
      }
    </style>
    <div class="loader" aria-hidden="true">
      <span class="loader-word loader-word--l">Full stack</span>
      <div class="loader-tile"><canvas></canvas></div>
      <span class="loader-word loader-word--r" data-loader-word>Geliştirici</span>
      <span class="loader-pct">0</span>
    </div>
    <script>
      (() => {
        const L = document.querySelector('.loader');
        const canvas = L.querySelector('canvas');
        const ctx = canvas.getContext('2d');
        const pctEl = L.querySelector('.loader-pct');
        const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

        // Dil: site ile aynı kural (kayıtlı seçim, yoksa tarayıcı dili).
        let lang = null;
        try { lang = localStorage.getItem('lang'); } catch (e) {}
        if (lang !== 'tr' && lang !== 'en') lang = (navigator.language || '').toLowerCase().startsWith('tr') ? 'tr' : 'en';
        if (lang === 'en') L.querySelector('[data-loader-word]').textContent = 'Developer';

        // Noktalı küre: Fibonacci dağılımıyla eşit aralıklı noktalar.
        const N = 220, pts = [];
        for (let i = 0; i < N; i++) {
          const y = 1 - (i / (N - 1)) * 2, r = Math.sqrt(1 - y * y), a = i * 2.39996;
          pts.push({ x: Math.cos(a) * r, y, z: Math.sin(a) * r, order: Math.random() });
        }

        // Yükleme: site kodu inerken %30'a kadar yavaşça yaklaşır; sonra
        // gerçek model indirmesi kalanı doldurur (window.__loader.progress).
        let target = 0, shown = 0, finished = false, closed = false;
        const t0 = performance.now();

        // Etkileşim: fare/parmak hareketi küreyi döndürür; tıklayınca dağılır.
        let rotX = 0.4, rotY = 0, velX = 0, velY = 0.012, burst = 0;
        let last = null;
        L.addEventListener('pointermove', (e) => {
          if (last) {
            velY += (e.clientX - last.x) * 0.0006;
            velX += (e.clientY - last.y) * 0.0006;
          }
          last = { x: e.clientX, y: e.clientY };
        });
        L.addEventListener('pointerleave', () => (last = null));
        L.addEventListener('pointerdown', () => (burst = 1));

        function resize() {
          const d = Math.min(devicePixelRatio || 1, 2);
          canvas.width = canvas.clientWidth * d;
          canvas.height = canvas.clientHeight * d;
        }
        resize();
        addEventListener('resize', resize);

        function frame(now) {
          if (closed) return;
          const creep = 0.3 * (1 - Math.exp(-(now - t0) / 1800));
          const goal = finished ? 1 : Math.max(target, creep);
          shown += (goal - shown) * (reduce ? 1 : 0.06);
          if (goal - shown < 0.002) shown = goal;
          L.style.setProperty('--p', shown);
          pctEl.textContent = Math.round(shown * 100);

          // Dönüş: hıza sürtünme uygulanır ama hiç durmaz.
          velY += (0.012 - velY) * 0.02;
          velX += (0 - velX) * 0.05;
          velY = Math.max(-0.25, Math.min(0.25, velY));
          if (!reduce) { rotY += velY; rotX += velX; }
          burst *= 0.92;

          const w = canvas.width, h = canvas.height, R = w * 0.33 * (1 + burst * 0.45);
          ctx.clearRect(0, 0, w, h);
          const cy = Math.cos(rotY), sy = Math.sin(rotY), cx = Math.cos(rotX), sx = Math.sin(rotX);
          for (const p of pts) {
            const x1 = p.x * cy + p.z * sy, z1 = -p.x * sy + p.z * cy;
            const y2 = p.y * cx - z1 * sx, z2 = p.y * sx + z1 * cx;
            const depth = (z2 + 1) / 2; // 0 arka, 1 ön
            const lit = p.order < shown;
            ctx.globalAlpha = 0.25 + depth * 0.75;
            ctx.fillStyle = lit ? '#86d6cb' : '#6b7079';
            ctx.beginPath();
            ctx.arc(w / 2 + x1 * R, h / 2 + y2 * R, (0.6 + depth * 1.4) * (w / 120), 0, 6.283);
            ctx.fill();
          }
          ctx.globalAlpha = 1;

          if (finished && shown >= 1) {
            closed = true;
            setTimeout(() => {
              L.classList.add('is-out');
              dispatchEvent(new Event('loader:done'));
              setTimeout(() => L.remove(), 800);
            }, 250);
            return;
          }
          requestAnimationFrame(frame);
        }
        requestAnimationFrame(frame);

        window.__loader = {
          progress: (p) => (target = Math.max(target, 0.3 + 0.7 * p)),
          finish: () => (finished = true),
        };
      })();
    </script>

    <header class="topbar">
      <a class="topbar-name" href="#top" data-name></a>
      <div class="topbar-right">
        <nav data-i18n-label="navLabel" aria-label="Bölümler">
          <a href="#hakkimda" data-i18n="navAbout">Hakkımda</a>
          <a href="#projeler" data-i18n="navProjects">Projeler</a>
          <a href="#iletisim" data-i18n="navContact">İletişim</a>
        </nav>
        <!-- Dil düğmesi: seçim tarayıcıda hatırlanır -->
        <div class="lang" role="group" data-i18n-label="langLabel" aria-label="Dil seçimi">
          <button type="button" data-lang="tr" lang="tr">TR</button>
          <button type="button" data-lang="en" lang="en">EN</button>
        </div>
      </div>
    </header>

    <!-- Arka plandaki dev isim: kafa bunun önünde durur. -->
    <div class="hero-name" aria-hidden="true">
      <span data-first></span>
      <span data-last></span>
    </div>

    <canvas class="stage" aria-hidden="true"></canvas>

    <main>
      <section class="hero" id="top">
        <h1 class="visually-hidden" data-fullname></h1>
        <p class="hero-role"><span data-role></span><br /><span data-location></span></p>
        <p class="hero-hint" data-i18n="heroHint">Kaydırarak tanış</p>
        <!-- Sadece dokunmatik ekranlarda görünür; ilk sürüklemede kaybolur -->
        <p class="drag-hint" aria-hidden="true"><span aria-hidden="true">↔</span> <span data-i18n="dragHint">Kafamı çevirmek için sürükle</span></p>
      </section>

      <section class="about" id="hakkimda" aria-labelledby="about-title">
        <div class="about-col">
          <h2 id="about-title" class="section-title" data-i18n="aboutTitle">Hakkımda</h2>
          <p class="about-lead" data-lead></p>
          <p class="about-body" data-body></p>
        </div>
      </section>

      <!-- Beceri şeridi: soldan sağa kendiliğinden kayar. Ortadaki spot ışığından
           geçen kelime aydınlanır (üstteki ikinci katman, ortası açık bir maskeyle).
           lang="en": büyük harfe çevirirken "i" → "İ" olmasın. -->
      <div class="marquee" lang="en">
        <h2 class="visually-hidden" data-i18n="skillsTitle">Kullandığım teknolojiler</h2>
        <ul class="marquee-track" data-skills></ul>
        <div class="marquee-lit" aria-hidden="true">
          <ul class="marquee-track" data-skills></ul>
        </div>
      </div>

      <!-- Öne çıkan proje vitrini: sayfa sabitlenir, ekran görüntüleri yatay akar. -->
      <section class="showcase" id="projeler" aria-labelledby="showcase-title">
        <div class="showcase-info">
          <h2 id="showcase-title" class="showcase-title" data-i18n="showcaseTitle">Uygulamalarım</h2>
          <img class="showcase-icon" data-f-icon alt="" width="88" height="88" />
          <!-- lang="en": büyük harfe çevirirken "i" Türkçe kuralla "İ" olmasın -->
          <h3 class="showcase-name" lang="en" data-f-name></h3>
          <p class="showcase-tagline" data-f-tagline></p>
          <p class="showcase-summary" data-f-summary></p>
          <div class="showcase-actions">
            <a class="btn btn--primary" data-f-store target="_blank" rel="noopener" data-i18n="storeButton">App Store'dan indir</a>
            <a class="btn" data-f-web target="_blank" rel="noopener"></a>
          </div>
          <p class="showcase-meta" data-f-meta></p>
        </div>
        <div class="showcase-strip">
          <ul class="showcase-track" data-f-screens></ul>
        </div>
      </section>

      <section class="projects" id="diger" aria-labelledby="projects-title">
        <div class="projects-col">
          <h2 id="projects-title" class="section-title" data-i18n="projectsTitle">Diğer projeler</h2>
          <ul class="project-list" data-projects></ul>
          <!-- Telefonda kartlar yana kaydırılır; noktalar hangi kartta olunduğunu gösterir -->
          <div class="pdots" data-pdots></div>
        </div>
      </section>

      <section class="contact" id="iletisim" aria-labelledby="contact-title">
        <!-- Fare üstüne gelince yazılar büyüteç lensiyle büyür (lens.js) -->
        <div class="contact-lens">
          <h2 id="contact-title" class="section-title" data-i18n="contactTitle">Bir şey mi yapıyoruz?</h2>
          <a class="contact-mail" data-mail></a>
        </div>
        <ul class="contact-links" data-links></ul>
      </section>
    </main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
